spring:
  application:
    name: kopitiam-agent

langchain4j:
  open-ai:
    chat-model:
      api-key:
      model-name: gpt-4o-mini
      temperature: 0.7
      log-requests: true
      log-responses: true

# Server configuration
server:
  port: 8080

# Logging configuration — enables full HTTP request/response body logging from LangChain4j
logging:
  level:
    dev.langchain4j: DEBUG
